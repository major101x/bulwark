<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bulwark</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #272e38;
    --text: #e6edf3; --dim: #8b949e;
    --ok: #3fb950; --warn: #d29922; --bad: #f85149; --accent: #58a6ff;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#fff; --panel:#f6f8fa; --line:#d0d7de; --text:#1f2328; --dim:#656d76; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-size:13px; line-height:1.5; }
  .wrap { max-width:1100px; margin:0 auto; padding:24px 16px 64px; }
  header { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:4px; }
  h1 { font-size:18px; margin:0; letter-spacing:-.3px; }
  .sub { color:var(--dim); font-size:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin:16px 0; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px 16px; }
  .card h2 { font-size:11px; text-transform:uppercase; letter-spacing:.7px; color:var(--dim); margin:0 0 8px; font-weight:600; }
  .big { font-size:30px; font-weight:600; letter-spacing:-1px; }
  .badge { display:inline-block; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600; letter-spacing:.4px; }
  .IDLE{background:rgba(63,185,80,.15);color:var(--ok)}
  .WATCH{background:rgba(88,166,255,.15);color:var(--accent)}
  .ARMED{background:rgba(210,153,34,.15);color:var(--warn)}
  .CRITICAL{background:rgba(248,81,73,.15);color:var(--bad)}
  section { margin-top:24px; }
  section > h2 { font-size:12px; text-transform:uppercase; letter-spacing:.7px; color:var(--dim); margin:0 0 10px; }
  .rationale { background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--accent);
    border-radius:6px; padding:12px 14px; white-space:pre-wrap; word-break:break-word; }
  .scroll { overflow-x:auto; border:1px solid var(--line); border-radius:8px; }
  table { border-collapse:collapse; width:100%; min-width:640px; }
  th,td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--dim); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
  tr:last-child td { border-bottom:none; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  .dim { color:var(--dim); }
  .warn-box { background:rgba(210,153,34,.1); border:1px solid rgba(210,153,34,.4);
    border-radius:6px; padding:10px 14px; margin-top:16px; }
  .warn-box h2 { color:var(--warn); }
  .empty { padding:16px; color:var(--dim); border:1px dashed var(--line); border-radius:8px; }
  footer { margin-top:32px; color:var(--dim); font-size:11px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Bulwark</h1>
    <span class="sub">liquidation defense · Sepolia position · mainnet audit trail</span>
  </header>
  <div class="sub" id="stamp">loading…</div>
  <div id="app"></div>
  <footer>
    Refreshes every 30s. Holds are attested as well as rescues: a keeper that
    only records its successes is not an audit trail.
  </footer>
</div>

<script>
const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h; return d; };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const short = (h) => h ? esc(h.slice(0, 10)) + '…' : '';
const usd = (n) => '$' + Number(n).toFixed(2);
const eth = (h) => `https://etherscan.io/tx/${h}`;
const sep = (h) => `https://sepolia.etherscan.io/tx/${h}`;
const when = (t) => new Date(t).toLocaleString();

function render(s) {
  document.getElementById('stamp').textContent =
    'updated ' + new Date(s.fetchedAt).toLocaleTimeString();

  const p = s.position, d = s.decision;
  const hf = p && p.healthFactor !== null ? p.healthFactor.toFixed(4) : '∞';
  let html = '';

  html += '<div class="grid">';
  html += `<div class="card"><h2>Health factor</h2><div class="big">${hf}</div>
    <div style="margin-top:6px"><span class="badge ${p ? p.tier : ''}">${p ? p.tier : 'unknown'}</span></div></div>`;
  html += `<div class="card"><h2>Position</h2>
    <div>collateral <b>${p ? usd(p.collateralUsd) : '?'}</b></div>
    <div>debt <b>${p ? usd(p.debtUsd) : '?'}</b></div>
    <div class="dim">liq. threshold ${p ? (p.liquidationThreshold*100).toFixed(0) + '%' : '?'}</div></div>`;
  html += `<div class="card"><h2>Keeper ammunition</h2>
    <div>USDC <b>${s.keeper ? s.keeper.usdc : '?'}</b></div>
    <div>LINK <b>${s.keeper ? s.keeper.link : '?'}</b></div>
    <div class="dim">spent on behalf of the position</div></div>`;
  html += `<div class="card"><h2>Economics</h2>
    <div>P(liquidation) <b>${d ? (d.liquidationProbability*100).toFixed(2) + '%' : '?'}</b></div>
    <div>expected loss <b>${d ? usd(d.expectedLossUsd) : '?'}</b></div>
    <div>rescue cost <b>${d ? usd(d.rescueCostUsd) : '?'}</b></div></div>`;
  html += '</div>';

  if (d) {
    html += `<section><h2>Current decision · ${esc(d.action)}</h2>
      <div class="rationale">${esc(d.rationale)}</div></section>`;
  }

  html += '<section><h2>Decision trail · GuardianLog on Ethereum mainnet</h2>';
  if (!s.attestations.length) {
    html += '<div class="empty">No attestations recorded yet.</div>';
  } else {
    html += '<div class="scroll"><table><thead><tr><th>When</th><th>Action</th><th>HF</th>' +
      '<th>Expected loss</th><th>Rescue cost</th><th>Attestation</th><th>Remediation</th></tr></thead><tbody>';
    for (const a of s.attestations) {
      html += `<tr>
        <td class="dim">${when(a.timestamp * 1000)}</td>
        <td><span class="badge ${a.action === 'HOLD' ? 'IDLE' : 'ARMED'}">${esc(a.action)}</span></td>
        <td>${a.healthFactor.toFixed(4)}</td>
        <td>${usd(a.expectedLossUsd)}</td>
        <td>${usd(a.rescueCostUsd)}</td>
        <td><a href="${eth(a.txHash)}" target="_blank" rel="noopener">${short(a.txHash)}</a></td>
        <td>${a.remediationTxHash
          ? `<a href="${sep(a.remediationTxHash)}" target="_blank" rel="noopener">${short(a.remediationTxHash)}</a>`
          : '<span class="dim">none, held</span>'}</td>
      </tr>`;
    }
    html += '</tbody></table></div>';
  }
  html += '</section>';

  html += `<section><h2>Execution trail · KeeperHub workflow runs <span class="dim" style="text-transform:none;letter-spacing:0">(showing ${s.workflowRuns.length} of ${s.totalWorkflowRuns})</span></h2>`;
  if (!s.workflowRuns.length) {
    html += '<div class="empty">No workflow runs recorded yet.</div>';
  } else {
    html += '<div class="scroll"><table><thead><tr><th>Started</th><th>Trigger</th><th>Status</th>' +
      '<th>Steps</th><th>Gas</th><th>Transactions</th></tr></thead><tbody>';
    for (const r of s.workflowRuns) {
      const txs = r.txHashes.length
        ? r.txHashes.map(h => `<a href="${sep(h)}" target="_blank" rel="noopener">${short(h)}</a>`).join(' ')
        : '<span class="dim">none, condition false</span>';
      html += `<tr>
        <td class="dim">${when(r.startedAt)}</td>
        <td>${esc(r.triggerSource)}</td>
        <td style="color:${r.status === 'success' ? 'var(--ok)' : 'var(--bad)'}">${esc(r.status)}</td>
        <td>${r.completedSteps}</td>
        <td class="dim">${r.gasUsedWei ?? 'n/a'}</td>
        <td>${txs}</td>
      </tr>`;
    }
    html += '</tbody></table></div>';
  }
  html += '</section>';

  if (s.warnings.length) {
    html += '<div class="warn-box"><h2>Incomplete data</h2>';
    for (const w of s.warnings) html += `<div>${esc(w)}</div>`;
    html += '</div>';
  }

  document.getElementById('app').innerHTML = html;
}

async function tick() {
  try {
    const r = await fetch('/api/state');
    render(await r.json());
  } catch (e) {
    document.getElementById('stamp').textContent = 'fetch failed: ' + e.message;
  }
}
tick();
setInterval(tick, 30000);
</script>
</body>
</html>
